<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/webp" href="/icons/spaceos-icon-192.webp" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="SpaceOS - Modern multi-workspace operating system for traders, educators, couples, and creators." />
    <title>SpaceOS</title>
  </head>
  <body class="bg-[#0f172a]">
    <div id="app"></div>
    <script>
      // Restore path if redirected from static 404.html fallback
      (function() {
        var redirect = sessionStorage.getItem('spaceos_redirect_path');
        if (redirect) {
          sessionStorage.removeItem('spaceos_redirect_path');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>

    <script>
      // Daftarkan Service Worker untuk PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              console.log('[SpaceOS PWA] Service Worker terdaftar pada scope:', reg.scope);
            }).catch((err) => {
              console.warn('[SpaceOS PWA] Registrasi Service Worker gagal:', err);
            });
          }
        });
      }
    </script>
  </body>
</html>
