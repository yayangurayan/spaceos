<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpaceOS" />
    <meta name="description" content="SpaceOS - Modern multi-workspace operating system for traders, educators, couples, and creators." />
    <title>SpaceOS</title>
  </head>
  <body class="bg-[#0f172a]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Fix refresh 404: Unregister any service workers on localhost/dev server
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister()
            }
          })
        } else if (window.location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {})
          })
        }
      }
    </script>
  </body>
</html>
