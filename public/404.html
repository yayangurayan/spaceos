<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SpaceOS - Redirecting...</title>
  <script>
    // SPA Single-page redirect for static hosts
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    sessionStorage.setItem('spaceos_redirect_path', path + search + hash);
    window.location.replace('/');
  </script>
</head>
<body style="background-color: #0a0e17; color: #94a3b8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Mengarahkan ke SpaceOS...</p>
</body>
</html>
